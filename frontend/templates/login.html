{{define "content"}}{{template "authshell" .}}{{end}}
{{define "authform"}}
<h1 class="font-display text-3xl font-extrabold">Log in</h1>
<div class="mt-6">{{template "alerts" .}}</div>
<form method="post" action="/login" class="space-y-4">
  <div><label class="label" for="email">Email</label>
    <input class="input" id="email" name="email" type="email" autocomplete="email" required value="{{.Email}}"></div>
  <div><label class="label" for="password">Password</label>
    <input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn w-full">Log in</button>
</form>
<p class="mt-5 text-sm"><a class="underline" href="/forgot">Forgot your password?</a></p>
<p class="mt-2 text-sm">New here? <a class="font-semibold underline" href="/register">Create an account</a></p>
{{end}}
