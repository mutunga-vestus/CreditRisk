name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l backend data frontend)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  model-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -r analysis/requirements.txt
      - name: Model loads and scores a sample applicant
        run: |
          python - <<'EOF'
          from analysis.serve import Applicant, default_probabilities, THRESHOLD
          a = Applicant(age=30, annual_income_kes=1_800_000, home_ownership="RENT",
                        employment_years=5, loan_intent="PERSONAL",
                        requested_amount_kes=200_000, default_on_file="N",
                        credit_history_years=4)
          p = default_probabilities(a, [200_000])[0]
          assert 0 <= p <= 1, p
          print("threshold", THRESHOLD, "default probability", round(p, 4))
          EOF

  docker:
    runs-on: ubuntu-latest
    needs: [go, model-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build model image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: analysis/Dockerfile
          push: false
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml